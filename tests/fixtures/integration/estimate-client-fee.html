<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>INTEGRATION — production Estimate formulas (fee_type=client)</title>
<style>
body{font-family:sans-serif;padding:16px}
.field{margin:8px 0}
input{width:120px}
</style>
</head>
<body>
<div class="banner"><strong>INTEGRATION FIXTURE</strong> — formulas copied from templates/admin-estimate.php with fee_type=client. Not a formula change.</div>
<form id="estimator">
	<p><label>Optimistic <input id="optimistic_estimate" type="number" step="0.25" min="0.25" value="1" /></label>
	<label>Most likely <input id="likely_estimate" type="number" step="0.25" min="0.25" value="1" /></label>
	<label>Pessimistic <input id="pessimistic_estimate" type="number" step="0.25" min="0.25" value="1" /></label></p>
	<p><label>Hourly rate <input id="hourly_rate" type="number" class="calc-input" value="100" min="35" max="1000" /></label>
	<label>Contractor fee % <input id="contractor_fee" type="number" class="calc-input" step="0.01" value="10" /></label>
	<label>Client fee % <input id="client_fee" type="number" class="calc-input" step="0.01" value="10" /></label></p>
	<p><label>Standard hours <input id="estimate_hours_standard" type="text" value="" readonly="readonly"/></label>
	<label>Paid by client <input id="payment" type="text" value="" readonly="readonly"/></label>
	<label>Estimate <input id="estimate" type="text" value="" readonly="readonly"/></label>
	<label>Earnings <input id="earnings" type="text" value="" readonly="readonly"/></label></p>
	<p><label>Cautious hours <input id="estimate_hours_pessimistic" type="text" value="" readonly="readonly"/></label>
	<label>Cautious paid by client <input id="payment_pessimistic" type="text" value="" readonly="readonly"/></label>
	<label>Cautious estimate <input id="estimate_pessimistic" type="text" value="" readonly="readonly"/></label>
	<label>Cautious earnings <input id="earnings_pessimistic" type="text" value="" readonly="readonly"/></label></p>
</form>
<script src="../vendor/jquery.min.js"></script>
<script>
/* Formulas must stay aligned with classes/estimate.php (wpcable_estimate).
 * fee_type = client (plugin default). Do not "fix" based on fill-order artifacts. */
jQuery(document).ready(function($) {
	function round(value, step) {
		step || (step = 1.0);
		var inv = 1.0 / step;
		return (Math.round(value * inv) / inv)
			.toLocaleString(false, {minimumFractionDigits: 2, maximumFractionDigits: 2});
	}
	function applyAllFees( value ) {
		var feeContractor = 1 / (1 - parseFloat( $('#contractor_fee').val() ) / 100);
		var feeClient     = 1 + parseFloat( $('#client_fee').val() ) / 100;
		var factor = feeClient;
		return round(value * factor, 0.01);
	}
	function applyMyFees( value ) {
		var feeContractor = 1 / (1 - parseFloat( $('#contractor_fee').val() ) / 100);
		var feeClient     = 1 + parseFloat( $('#client_fee').val() ) / 100;
		var factor = 1;
		return round(value * factor, 0.01);
	}
	function withoutFees( value ) {
		var feeContractor = 1 / (1 - parseFloat( $('#contractor_fee').val() ) / 100);
		var feeClient     = 1 + parseFloat( $('#client_fee').val() ) / 100;
		var factor = feeContractor;
		return round(value / factor, 0.01);
	}
	function showTime( time ) {
		var hours   = Math.floor( time );
		var minutes = parseInt((time - hours) * 60);
		return hours + ':' + ('00' + minutes).substr( -2 );
	}
	function calculate() {
		var optimistic  = parseFloat($('#optimistic_estimate').val());
		var likely      = parseFloat($('#likely_estimate').val());
		var pessimistic = parseFloat($('#pessimistic_estimate').val());
		var rate        = parseFloat($('#hourly_rate').val());
		var estimate_hours_standard    = (optimistic + 4 * likely + pessimistic) / 6;
		var estimate_hours_pessimistic = (optimistic + 2 * likely + 3 * pessimistic) / 6;
		var estimate_standard    = estimate_hours_standard * rate;
		var estimate_pessimistic = estimate_hours_pessimistic * rate;
		$('#estimate_hours_standard').val(showTime( estimate_hours_standard ));
		$('#estimate_hours_pessimistic').val(showTime( estimate_hours_pessimistic ));
		$('#payment').val(applyAllFees( estimate_standard ));
		$('#payment_pessimistic').val(applyAllFees( estimate_pessimistic ));
		$('#estimate').val(applyMyFees( estimate_standard ));
		$('#estimate_pessimistic').val(applyMyFees( estimate_pessimistic ));
		$('#earnings').val(withoutFees( estimate_standard ));
		$('#earnings_pessimistic').val(withoutFees( estimate_pessimistic ));
	}
	function validateO() {
		var valO = parseFloat($('#optimistic_estimate').val());
		var valM = parseFloat($('#likely_estimate').val());
		var valP = parseFloat($('#pessimistic_estimate').val());
		if (valO > valM) { $('#likely_estimate').val(valO); }
		if (valO > valP) { $('#pessimistic_estimate').val(valO); }
		calculate();
	}
	function validateM() {
		var valO = parseFloat($('#optimistic_estimate').val());
		var valM = parseFloat($('#likely_estimate').val());
		var valP = parseFloat($('#pessimistic_estimate').val());
		if (valO > valM) { $('#optimistic_estimate').val(valM); }
		if (valM > valP) { $('#pessimistic_estimate').val(valM); }
		calculate();
	}
	function validateP() {
		var valO = parseFloat($('#optimistic_estimate').val());
		var valM = parseFloat($('#likely_estimate').val());
		var valP = parseFloat($('#pessimistic_estimate').val());
		if (valO > valP) { $('#optimistic_estimate').val(valP); }
		if (valM > valP) { $('#likely_estimate').val(valP); }
		calculate();
	}
	$('.calc-input').on('change', calculate);
	$('#optimistic_estimate').on('change', validateO);
	$('#likely_estimate').on('change', validateM);
	$('#pessimistic_estimate').on('change', validateP);
	calculate();
	window.__wpcableCalculate = calculate;
	window.__wpcableSetHours = function (o, m, p) {
		$('#optimistic_estimate').val(o).trigger('input').trigger('change').trigger('blur');
		$('#likely_estimate').val(m).trigger('input').trigger('change').trigger('blur');
		$('#pessimistic_estimate').val(p).trigger('input').trigger('change').trigger('blur');
	};
	if (location.hash === '#seq-2410') {
		window.__wpcableSetHours(2, 4, 10);
	}
});
</script>
</body>
</html>
